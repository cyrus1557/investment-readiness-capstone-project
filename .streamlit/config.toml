# App theme: Predictive Minds colours
[theme]
base = "light"
primaryColor = "#15803D"
backgroundColor = "#FAF7F0"
secondaryBackgroundColor = "#EEF3EC"
textColor = "#0A1F3C"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#14532D"
secondaryBackgroundColor = "#1B6B3A"
textColor = "#F8FAF9"
primaryColor = "#D4A017"

[server]
maxUploadSize = 20

[client]
toolbarMode = "viewer"
